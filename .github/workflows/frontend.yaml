name: frontend build 
on: 
 push:
  paths:
   - "frontend/**"
jobs:
 build: 
  runs-on: ubuntu-latest 
  steps:
   - uses: actions/checkout@v4 
   - uses: actions/setup-node@v4
     with: 
       node-version: 20
   - name: Install dependencies 
     working-directory: frontend 
     run: npm install 
   - name: docker 
     run: docker build -t rajsoni968392/frontend:latest ./frontend   
